# Runs v-panel itself as a container (recommended installation).
#   sudo ./deploy/docker-install.sh          # or the manual steps in README.md
#
# v-panel manages the host's Docker through the socket, so:
#  - /opt/vpanel MUST be mounted at the SAME path inside the container: compose files written there
#    are executed by the host's Docker daemon, which resolves bind mounts with host paths.
#  - access to docker.sock is root-equivalent: keep port 5080 on localhost. Reach the panel with an SSH tunnel
#    (ssh -N -L 5080:127.0.0.1:5080 user@server, always available even if Caddy/cloudflared are down) and/or publish it
#    through Cloudflare Tunnel -> Caddy via Settings > v-panel public URL (protect that hostname with Cloudflare Access).
name: vpanel

services:
  vpanel:
    image: ghcr.io/lockerbill/v-panel:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vpanel
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vpanel:/opt/vpanel
    environment:
      # Upstream used for the panel's own Caddy route (Caddy reaches v-panel on the shared network).
      VPanel__Defaults__PanelUpstream: vpanel:8080
    networks:
      - shared

networks:
  shared:
    external: true
    # The shared network of the Caddy stack: vpanel-shared, or the existing one on servers adopted with --adopt
    # (set in /opt/vpanel/vpanel.env, passed with --env-file by docker-install.sh).
    name: ${VPANEL_SHARED_NETWORK:-vpanel-shared}
